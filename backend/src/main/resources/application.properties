spring.application.name=secure-smart-apartment-society-management-platform
server.port=${PORT:8080}

# Primary MySQL 8 Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ssasm_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Adarsh@2005}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Cloud Settings
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Jackson Timezone Configuration
spring.jackson.time-zone=UTC
spring.jackson.serialization.indent_output=false

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Security & JWT Credentials
app.security.jwt.secret=${JWT_SECRET:QnJvd3NlcndhdGVyLWF1dGgta2V5LXNlY3JldC0zMi1ieXRlcy1taW5pbXVt}
app.security.jwt.access-token-validity-ms=86400000
app.security.jwt.issuer=ssasm

# Logging Configuration
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.ssasm=INFO
logging.level.com.ssasm.audit=INFO
